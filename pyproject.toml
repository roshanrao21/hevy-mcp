[project]
name = "hevy-mcp"
version = "0.1.0"
description = "A guarded MCP server for the official Hevy fitness API"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.28.1,<2",
  "httpx>=0.28.1,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.35,<1",
  "starlette>=0.47,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
hevy-mcp = "hevy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hevy_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
